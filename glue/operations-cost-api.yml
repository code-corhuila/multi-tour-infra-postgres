# The gateway routes to this container by the name multi-tour-operations-cost-api (its routes/operations-cost.conf).
# The address of the single instance is the platform's to give: the service connects as operations_cost_app.
services:
  operations-cost-api:
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${PG_DATABASE}
      DATABASE_PASSWORD: ${OPERATIONS_COST_APP_PASSWORD}
      # the catalog of the tours belongs to commercial-reservation; the gateway reaches it by the same name
      COMMERCIAL_RESERVATION_BASE_URL: http://multi-tour-commercial-reservation-api:8083
    networks:
      platform:
        aliases: [multi-tour-operations-cost-api]
