# Demo only, opt in with: docker compose -f platform.yml -f demo-front-port.yml ... (scripts/up.sh dev --demo).
# People open the demo on 4200 out of habit. The front alone has no API (any call answers 405), so 4200 must lead
# to the gateway, which serves the shell and the API on one origin. The norm lets only the gateway publish a
# port (5.6.1): the front never does. Port 8080 stays published by platform.yml.
services:
  api-gateway:
    ports: ["4200:8080"]